name: Build and Push FileKey Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5730b3fa5a8d2b28f67e9c99bd28b83cadf2c38  # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lrgabriel/dockerized_filekey:v${{ inputs.version }}
            ghcr.io/lrgabriel/dockerized_filekey:latest
            ghcr.io/lrgabriel/dockerized_filekey:v${{ inputs.version }}-${{ steps.sha.outputs.short }}

      - name: Get build timestamp
        id: timestamp
        run: echo "ts=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          tag_name: v${{ inputs.version }}
          name: FileKey v${{ inputs.version }}
          body: "Built: ${{ steps.timestamp.outputs.ts }}"
