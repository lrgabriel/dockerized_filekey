name: Build OpenSSL Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, x86]
        include:
          - arch: x86_64
            config: VC-WIN64A
            vcvars: x86_amd64
          - arch: x86
            config: VC-WIN32
            vcvars: x86

    steps:
      - name: Checkout your private repo
        uses: actions/checkout@v4

      - name: Verify OpenSSL repository integrity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check repository metadata via GitHub API
          $repo_info = curl -s -H "Authorization: token $env:GITHUB_TOKEN" `
            -H "Accept: application/vnd.github.v3+json" `
            "https://api.github.com/repos/openssl/openssl" | ConvertFrom-Json

          # Verification 1: Check repository ID
          $expected_id = 7634677
          $actual_id = $repo_info.id
          Write-Host "Expected Repository ID: $expected_id"
          Write-Host "Actual Repository ID: $actual_id"
          if ($actual_id -ne $expected_id) {
            Write-Error "Repository ID mismatch! Expected $expected_id but got $actual_id"
            exit 1
          }
          Write-Host "✓ Repository ID verification passed"

          # Verification 2: Check if repository is archived
          $is_archived = $repo_info.archived
          Write-Host "Repository Archived Status: $is_archived"
          if ($is_archived) {
            Write-Error "OpenSSL repository is archived! Cannot build from archived repository."
            exit 1
          }
          Write-Host "✓ Repository active status verification passed"

          # Verification 3: Check repository owner
          $expected_owner = "openssl"
          $actual_owner = $repo_info.owner.login
          Write-Host "Expected Owner: $expected_owner"
          Write-Host "Actual Owner: $actual_owner"
          if ($actual_owner -ne $expected_owner) {
            Write-Error "Repository owner mismatch! Expected $expected_owner but got $actual_owner"
            exit 1
          }
          Write-Host "✓ Repository owner verification passed"

          # Verification 4: Verify it's the actual OpenSSL repo by checking key files
          Write-Host "Checking for expected OpenSSL topics..."
          if (-not $repo_info.topics -or $repo_info.topics -notcontains "openssl") {
            Write-Warning "OpenSSL topic not found in repository topics"
          }

          # Verification 5: Check repository description contains OpenSSL reference
          $description = $repo_info.description
          Write-Host "Repository Description: $description"
          if ($description -notlike "*OpenSSL*" -and $description -notlike "*openssl*") {
            Write-Warning "Repository description does not mention OpenSSL"
          }

          # Verification 6: Check for expected main branch
          $default_branch = $repo_info.default_branch
          Write-Host "Default Branch: $default_branch"
          if ($default_branch -ne "master") {
            Write-Warning "Default branch is $default_branch (expected master)"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "All repository verifications passed!"
          Write-Host "=========================================="

      - name: Get latest OpenSSL release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Fetching latest stable OpenSSL release..."
          
          # Fetch latest release info (excludes pre-releases by default)
          $release_info = curl -s -H "Authorization: token $env:GITHUB_TOKEN" `
            -H "Accept: application/vnd.github.v3+json" `
            "https://api.github.com/repos/openssl/openssl/releases/latest" | ConvertFrom-Json

          $tag_name = $release_info.tag_name
          $release_name = $release_info.name
          $published_at = $release_info.published_at
          $author = $release_info.author.login
          $download_count = ($release_info.assets | Measure-Object).Count
          
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Latest Stable Release Information:"
          Write-Host "=========================================="
          Write-Host "Tag: $tag_name"
          Write-Host "Name: $release_name"
          Write-Host "Published: $published_at"
          Write-Host "Author: $author"
          Write-Host "Available Assets: $download_count"
          Write-Host "Pre-release: $($release_info.prerelease)"
          Write-Host ""
          
          # Verify it's not a pre-release
          if ($release_info.prerelease) {
            Write-Error "Latest release is marked as pre-release! Use workflow_dispatch to override if needed."
            exit 1
          }
          
          # Extract version for artifact naming
          $version = $tag_name -replace "^openssl-", ""
          Write-Host "Extracted Version: $version"
          Write-Host ""
          
          # Store for later use
          echo "LATEST_RELEASE_TAG=$tag_name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify latest release commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Verifying release commit SHA..."
          
          # Get the commit info for the release tag
          $commit_info = curl -s -H "Authorization: token $env:GITHUB_TOKEN" `
            -H "Accept: application/vnd.github.v3+json" `
            "https://api.github.com/repos/openssl/openssl/commits/$env:LATEST_RELEASE_TAG" | ConvertFrom-Json

          $tag_commit_sha = $commit_info.sha
          $commit_message = $commit_info.commit.message
          $commit_author = $commit_info.commit.author.name
          $commit_date = $commit_info.commit.author.date
          
          Write-Host "Release Commit SHA: $tag_commit_sha"
          Write-Host "Commit Author: $commit_author"
          Write-Host "Commit Date: $commit_date"
          Write-Host "Commit Message (first line): $($commit_message -split "`n" | Select-Object -First 1)"
          
          echo "EXPECTED_COMMIT_SHA=$tag_commit_sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clone OpenSSL source at latest release
        run: |
          Write-Host "Cloning OpenSSL repository..."
          git clone --depth 1 --branch $env:LATEST_RELEASE_TAG https://github.com/openssl/openssl.git openssl-src
          
          cd openssl-src
          $cloned_sha = git rev-parse HEAD
          
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Clone Verification:"
          Write-Host "=========================================="
          Write-Host "Cloned Commit SHA: $cloned_sha"
          Write-Host "Expected Commit SHA: $env:EXPECTED_COMMIT_SHA"
          
          # Verify the cloned commit matches the expected one
          if ($cloned_sha -ne $env:EXPECTED_COMMIT_SHA) {
            Write-Error "Cloned commit SHA does not match expected SHA!"
            exit 1
          }
          Write-Host "✓ Cloned commit SHA verified"
          
          # Show git info
          Write-Host ""
          Write-Host "Git Information:"
          git log --oneline -1
          git show-ref
          Write-Host ""

      - name: Verify critical OpenSSL files exist
        run: |
          Write-Host "Verifying critical OpenSSL files..."
          
          $critical_files = @(
            "openssl-src\Configure",
            "openssl-src\INSTALL.md",
            "openssl-src\NOTES-WINDOWS.md",
            "openssl-src\LICENSE.txt",
            "openssl-src\crypto",
            "openssl-src\ssl",
            "openssl-src\include"
          )

          foreach ($file in $critical_files) {
            if (-not (Test-Path $file)) {
              Write-Error "Critical file missing: $file"
              exit 1
            }
            Write-Host "✓ Found: $file"
          }
          Write-Host ""
          Write-Host "All critical OpenSSL files verified!"
          Write-Host ""

      - name: Install Strawberry Perl
        run: |
          Write-Host "Installing Strawberry Perl..."
          choco install strawberryperl -y
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "✓ Strawberry Perl installed"

      - name: Install NASM
        run: |
          Write-Host "Installing NASM..."
          choco install nasm -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "✓ NASM installed"

      - name: Locate Visual Studio
        run: |
          Write-Host "Locating Visual Studio installation..."
          $vs_path = & "C:\Program Files\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio path: $vs_path"
          
          if (-not $vs_path) {
            Write-Error "Visual Studio not found!"
            exit 1
          }
          
          echo "VS_PATH=$vs_path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "✓ Visual Studio located"

      - name: Build OpenSSL
        shell: cmd
        run: |
          cd openssl-src
          
          REM Set up Visual Studio environment
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }}
          
          REM Verify environment
          echo.
          echo ========================================
          echo Building OpenSSL for ${{ matrix.arch }}
          echo ========================================
          echo Configuration: ${{ matrix.config }}
          echo VCVARS argument: ${{ matrix.vcvars }}
          echo.
          
          REM Show which compilers are available
          where cl.exe
          where nmake.exe
          echo.
          
          REM Configure
          echo Configuring OpenSSL...
          perl Configure ${{ matrix.config }} --prefix=C:\OpenSSL-${{ matrix.arch }}
          if errorlevel 1 (
            echo Configure failed!
            exit /b 1
          )
          echo Configure completed successfully
          echo.
          
          REM Build
          echo Building OpenSSL...
          nmake
          if errorlevel 1 (
            echo Build failed!
            exit /b 1
          )
          echo Build completed successfully
          echo.
          
          REM Test (optional, continue on error)
          echo Running tests...
          nmake test
          if errorlevel 1 (
            echo Some tests failed, but continuing...
          )
          echo.
          
          REM Install
          echo Installing OpenSSL...
          nmake install
          if errorlevel 1 (
            echo Install failed!
            exit /b 1
          )
          echo Install completed successfully
          echo.
          echo ========================================
          echo Build process completed
          echo ========================================

      - name: Verify build artifacts
        run: |
          Write-Host "Verifying build artifacts for ${{ matrix.arch }}..."
          
          $artifacts = @(
            "C:\OpenSSL-${{ matrix.arch }}\bin\openssl.exe",
            "C:\OpenSSL-${{ matrix.arch }}\lib"
          )

          foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact)) {
              Write-Error "Build artifact missing: $artifact"
              exit 1
            }
            Write-Host "✓ Verified: $artifact"
          }
          
          # Show file info
          Write-Host ""
          Write-Host "OpenSSL executable details:"
          Get-Item "C:\OpenSSL-${{ matrix.arch }}\bin\openssl.exe" | Format-List FullName, Length, LastWriteTime
          Write-Host ""

      - name: Create artifact summary
        run: |
          Write-Host "Artifact Summary for ${{ matrix.arch }}"
          Write-Host "OpenSSL Version: $env:OPENSSL_VERSION"
          Write-Host "Release Tag: $env:LATEST_RELEASE_TAG"
          Write-Host "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          
          # Get file listing
          Write-Host ""
          Write-Host "Contents of C:\OpenSSL-${{ matrix.arch }}:"
          Get-ChildItem -Path "C:\OpenSSL-${{ matrix.arch }}" -Recurse | `
            Select-Object @{n='RelativePath';e={$_.FullName -replace [regex]::Escape("C:\OpenSSL-${{ matrix.arch }}\"), ''}}, Length, LastWriteTime | `
            Format-Table -AutoSize

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openssl-${{ env.OPENSSL_VERSION }}-windows-${{ matrix.arch }}
          path: C:\OpenSSL-${{ matrix.arch }}\**\*
          retention-days: 90
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Build Summary"
          Write-Host "=========================================="
          Write-Host "OpenSSL Version: $env:OPENSSL_VERSION"
          Write-Host "Release Tag: $env:LATEST_RELEASE_TAG"
          Write-Host "Architecture: ${{ matrix.arch }}"
          Write-Host "Configuration: ${{ matrix.config }}"
          Write-Host "Build Status: ${{ job.status }}"
          Write-Host "=========================================="
