name: Build and Push FileKey Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  FILEKEY_EXPECTED_REPO_ID: 977171031

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify upstream FileKey repository
        id: verify-repo
        run: |
          echo "Fetching RockwellShah/filekey repository metadata..."
          REPO_JSON=$(curl -sf https://api.github.com/repos/RockwellShah/filekey) || {
            echo "ERROR: Failed to fetch repository metadata from GitHub API" >&2
            exit 1
          }

          IFS=$'\t' read -r OWNER ARCHIVED DISABLED REPO_ID <<< \
            "$(echo "$REPO_JSON" | jq -r '[.owner.login, (.archived|tostring), (.disabled|tostring), (.id|tostring)] | @tsv')"

          FAIL=0

          if [ "$OWNER" != "RockwellShah" ]; then
            echo "ERROR: Repository owner is '$OWNER', expected 'RockwellShah'" >&2
            FAIL=1
          fi

          if [ "$ARCHIVED" != "false" ]; then
            echo "ERROR: Repository is archived" >&2
            FAIL=1
          fi

          if [ "$DISABLED" != "false" ]; then
            echo "ERROR: Repository is disabled" >&2
            FAIL=1
          fi

          if [ "$REPO_ID" != "$FILEKEY_EXPECTED_REPO_ID" ]; then
            echo "ERROR: Repository ID is '$REPO_ID', expected '$FILEKEY_EXPECTED_REPO_ID'" >&2
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "Upstream repository verification FAILED. Aborting build." >&2
            exit 1
          fi

          echo "Upstream repository verified: owner=$OWNER, id=$REPO_ID, archived=$ARCHIVED, disabled=$DISABLED"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo_id=$REPO_ID" >> "$GITHUB_OUTPUT"

      - name: Verify commit signature
        id: verify-commit
        run: |
          echo "Fetching commit metadata for RockwellShah/filekey main branch..."
          COMMIT_JSON=$(curl -sf https://api.github.com/repos/RockwellShah/filekey/commits/main) || {
            echo "ERROR: Failed to fetch commit metadata from GitHub API" >&2
            exit 1
          }

          VERIFIED=$(echo "$COMMIT_JSON" | jq -r '.commit.verification.verified')
          REASON=$(echo "$COMMIT_JSON" | jq -r '.commit.verification.reason')
          COMMIT_SHA=$(echo "$COMMIT_JSON" | jq -r '.sha')
          AUTHOR_NAME=$(echo "$COMMIT_JSON" | jq -r '.commit.author.name')
          AUTHOR_EMAIL=$(echo "$COMMIT_JSON" | jq -r '.commit.author.email')
          COMMIT_DATE=$(echo "$COMMIT_JSON" | jq -r '.commit.author.date')

          echo "Commit SHA:  $COMMIT_SHA"
          echo "Author:      $AUTHOR_NAME <$AUTHOR_EMAIL>"
          echo "Commit date: $COMMIT_DATE"
          echo "Verified:    $VERIFIED"
          echo "Reason:      $REASON"

          if [ "$VERIFIED" != "true" ]; then
            echo "ERROR: Commit is not verified by GitHub (verified=$VERIFIED, reason=$REASON)" >&2
            exit 1
          fi

          if [ "$REASON" != "valid" ]; then
            echo "ERROR: Commit signature reason is not 'valid' (reason=$REASON)" >&2
            exit 1
          fi

          echo "Commit signature verification PASSED"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "author_name=$AUTHOR_NAME" >> "$GITHUB_OUTPUT"
          echo "author_email=$AUTHOR_EMAIL" >> "$GITHUB_OUTPUT"
          echo "commit_date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lrgabriel/dockerized_filekey:v${{ inputs.version }}
            ghcr.io/lrgabriel/dockerized_filekey:latest
            ghcr.io/lrgabriel/dockerized_filekey:v${{ inputs.version }}-${{ steps.sha.outputs.short }}

      - name: Get build timestamp
        id: timestamp
        run: echo "ts=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          {
            echo "## FileKey v${{ inputs.version }}"
            echo ""
            echo "### 🔒 Security Verification"
            echo ""
            echo "#### Repository Verification ([RockwellShah/filekey](https://github.com/RockwellShah/filekey))"
            echo "- ✅ Owner: \`${{ steps.verify-repo.outputs.owner }}\` (expected: \`RockwellShah\`)"
            echo "- ✅ Repository ID: \`${{ steps.verify-repo.outputs.repo_id }}\` (expected: \`${{ env.FILEKEY_EXPECTED_REPO_ID }}\`)"
            echo "- ✅ Not archived"
            echo "- ✅ Not disabled"
            echo ""
            echo "#### Commit Signature Verification"
            echo "- ✅ GitHub verified: \`${{ steps.verify-commit.outputs.verified }}\`"
            echo "- ✅ Signature reason: \`${{ steps.verify-commit.outputs.reason }}\`"
            echo ""
            echo "#### Commit Details"
            echo "- 🔑 SHA: \`${{ steps.verify-commit.outputs.commit_sha }}\`"
            echo "- 👤 Author: ${{ steps.verify-commit.outputs.author_name }} \`<${{ steps.verify-commit.outputs.author_email }}>\`"
            echo "- 📅 Commit date: \`${{ steps.verify-commit.outputs.commit_date }}\`"
            echo ""
            echo "### 📋 Build Info"
            echo "- 🕐 Built: \`${{ steps.timestamp.outputs.ts }}\`"
            echo "- 🔢 Workflow run: \`${{ github.run_id }}\`"
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          tag_name: v${{ inputs.version }}
          name: FileKey v${{ inputs.version }}
          body_path: /tmp/release-notes.md
